<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaCloud Control Panel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>NexaCloud Control Panel</h1>

    <div id="package-management">
        <h2>Package Management</h2>
        <table id="package-list">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Version</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Package data will be inserted here by app.js -->
            </tbody>
        </table>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
